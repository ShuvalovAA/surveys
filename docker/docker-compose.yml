services:
  migrate:
    platform: linux/amd64
    networks:
      - surveys
    image: surveys/surveys:dev
    command: >
      sh -c "uv run python manage.py migrate && 
             (uv run python manage.py createsuperuser --noinput || true)"
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy # <--- Ждем, пока healthcheck станет зелёным

  app:
    platform: linux/amd64
    tty: true
    stdin_open: true
    networks:
      - surveys
    image: surveys/surveys:dev
    volumes:
      - ../src/surveys:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  postgres:
    platform: linux/amd64
    networks:
      - surveys
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surveys
      POSTGRES_USER: surveys
      POSTGRES_PASSWORD: surveys
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveys -d surveys"]
      interval: 2s
      timeout: 5s
      retries: 10

  nginx:
    platform: linux/amd64
    networks:
      - surveys
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


networks:
  surveys:
    driver: bridge